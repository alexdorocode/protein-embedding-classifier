[tool.poetry]
name = "protein-embedding-classifier"
version = "0.1.0"
description = "Protein embedding classification experiments and runners"
authors = ["Alex Doro <alex@example.com>"]
packages = [{ include = "protein_embedding_classifier" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^2.0.0"
pyyaml = "^6.0.2"
sqlalchemy = "^2.0.38"
psycopg2-binary = "^2.9.10"
scikit-learn = "^1.6.1"
wandb = "^0.25.0"
pandas = "^2.2.3"
xgboost = "^3.2.0"
torch = "^2.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[tool.pytest.ini_options]
pythonpath = [".", "protein_embedding_classifier"]
testpaths = ["tests"]

[tool.poetry.scripts]
pec = "protein_embedding_classifier.main:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

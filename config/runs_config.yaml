# Runs Configuration for Protein Embedding Classifier
# 
# This file defines the configuration for dataset designer runs.
# It serves as a central configuration point for run management.
#
# IMPORTANT TERMINOLOGY:
# - TP = Target Protein (NOT Multifunctional Protein)
# - NTP = Non-Target Protein (NOT Non-Multifunctional Protein)
# - See docs/TERMINOLOGY_CLARIFICATION.md for details

runs:
  # Humans dataset (Homo sapiens only)
  humans:
    run_id: "20260803_0258_7672b947"
    short_id: "0258"
    species_category: "humans"
    species: "Homo sapiens (Human)"
    description: "Human proteins dataset for TP/NTP classification"
    base_path: "dataset_designer_runs"
    
    # Primary files
    primary_dataset: "final_dataset.csv"
    alternative_datasets:
      - "target_non_target_dataset.csv"
      - "target_non_target_pairs.csv"
    
    # Assignment files (in order of preference)
    assignment_files:
      - "target_assignments.csv"  # Correct terminology
      - "mf_assignments.csv"      # Legacy name
    
    # Metrics files
    tp_metrics: "mf_metricas.csv"      # Legacy name, contains TP metrics
    ntp_metrics: "candidatas_metricas.csv"
    
    # Metadata
    metadata: "run_metadata.json"
    pipeline_log: "pipeline.log"
    
    # Statistics from run
    statistics:
      filter1_rows: 1162306
      filter2_rows: 22856
      filter3_rows: 2351
      final_rows: 2351
      duration_seconds: 1415.625
      random_seed: 42
    
    # Usage flags
    use_for_training: true
    use_for_validation: true
    use_for_testing: true
    use_for_benchmarking: true

  # Model organisms dataset (multi-species)
  model_organisms:
    run_id: "20260803_0304_a68aa0bb"
    short_id: "0304"
    species_category: "model_organisms"
    species: "Model Organisms (Multi-species)"
    description: "Multi-species dataset for TP/NTP classification"
    base_path: "dataset_designer_runs"
    
    # Organisms included
    organisms:
      - "Arabidopsis thaliana (Mouse-ear cress)."
      - "Escherichia coli (strain K12)."
      - "Mus musculus (Mouse)."
      - "Saccharomyces cerevisiae (Baker's yeast)."
    
    # Primary files
    primary_dataset: "final_dataset.csv"
    alternative_datasets:
      - "target_non_target_dataset.csv"
      - "target_non_target_pairs.csv"
    
    # Assignment files
    assignment_files:
      - "target_assignments.csv"
      - "mf_assignments.csv"
    
    # Metrics files
    tp_metrics: "mf_metricas.csv"
    ntp_metrics: "candidatas_metricas.csv"
    
    # Metadata
    metadata: "run_metadata.json"
    pipeline_log: "pipeline.log"
    
    # Statistics from run
    statistics:
      filter1_rows: 241917
      filter2_rows: 19532
      filter3_rows: 1188
      final_rows: 1188
      duration_seconds: 422.141
      random_seed: 42
    
    # Usage flags
    use_for_training: true
    use_for_validation: true
    use_for_testing: true
    use_for_benchmarking: true

# Experiment configurations
 experiments:
  # Single species experiments
  humans_only:
    name: "Humans Only"
    description: "Train and evaluate on human proteins only"
    run_id: "${runs.humans.run_id}"
    species: "${runs.humans.species_category}"
    
  model_organisms_only:
    name: "Model Organisms Only"
    description: "Train and evaluate on model organism proteins only"
    run_id: "${runs.model_organisms.run_id}"
    species: "${runs.model_organisms.species_category}"
    
  # Cross-species experiments
  cross_species_humans_to_model:
    name: "Cross-Species: Humans to Model"
    description: "Train on humans, test on model organisms"
    train_run: "${runs.humans.run_id}"
    test_run: "${runs.model_organisms.run_id}"
    train_species: "${runs.humans.species_category}"
    test_species: "${runs.model_organisms.species_category}"
    
  cross_species_model_to_humans:
    name: "Cross-Species: Model to Humans"
    description: "Train on model organisms, test on humans"
    train_run: "${runs.model_organisms.run_id}"
    test_run: "${runs.humans.run_id}"
    train_species: "${runs.model_organisms.species_category}"
    test_species: "${runs.humans.species_category}"
    
  # Combined experiments
  combined_all:
    name: "Combined All Species"
    description: "Combine both runs for multi-species training"
    runs:
      - "${runs.humans.run_id}"
      - "${runs.model_organisms.run_id}"
    species: "combined"

# File loading configuration
file_loading:
  # Column name standardization
  column_mapping:
    # Legacy to current column names
    mf_id: tp_id
    nmf_id: ntp_id
    target_id: tp_id
    non_target_id: ntp_id
    
  # File name patterns
  patterns:
    primary_dataset: 
      - "final_dataset.csv"
      - "target_non_target_dataset.csv"
      - "target_non_target_pairs.csv"
    
    assignments:
      - "target_assignments.csv"
      - "mf_assignments.csv"
    
    tp_metrics:
      - "mf_metricas.csv"
      - "tp_metrics.csv"
    
    ntp_metrics:
      - "candidatas_metricas.csv"
      - "ntp_metrics.csv"

# Validation rules
validation:
  required_files:
    - "final_dataset.csv"
    - "run_metadata.json"
    - "pipeline.log"
    - "target_assignments.csv"
    - "mf_assignments.csv"
    - "mf_metricas.csv"
    - "candidatas_metricas.csv"
    - "filter1_output.csv"
    - "filter2_output.csv"
    - "filter3_output.csv"
  
  required_metadata_fields:
    - "run_id"
    - "species"
    - "species_category"
    - "timestamp"
    - "config_hash"
    - "statistics"
  
  required_columns:
    final_dataset:
      - "tp_id"
      - "ntp_id"
    
    assignments:
      - "target_id"  # or "mf_id" for legacy
      - "num_candidates"
      - "candidates"

# Benchmarking configuration
benchmarking:
  default_runs:
    - "${runs.humans.run_id}"
    - "${runs.model_organisms.run_id}"
  
  comparison_strategies:
    - "same_species"
    - "cross_species"
    - "combined_species"
  
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "confusion_matrix"

# Terminology enforcement
terminology:
  # Allowed terms
  allowed:
    protein_classification:
      - "TP"
      - "NTP"
      - "Target Protein"
      - "Non-Target Protein"
      - "tp_id"
      - "ntp_id"
    
    gene_ontology:
      - "BP"  # Biological Process
      - "MF"  # Molecular Function (ALLOWED in GO context)
      - "CC"  # Cellular Component
  
  # Prohibited terms (for protein classification)
  prohibited:
    - "MFP"
    - "MF"    # When referring to proteins (NOT GO)
    - "NMF"
    - "multifunctional"
    - "multifunctionality"
    - "mf_"   # Prefix for protein-related files
    - "nmf_"  # Prefix for protein-related files

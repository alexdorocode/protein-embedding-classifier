################################################################################
# Protein Embedding Classifier - Pipeline configuration
#
# How to run:
#   poetry run pec --config config/pipeline.yaml --step dataset
#   poetry run pec --config config/pipeline.yaml --all
#
# Notes:
# - Right now only the "dataset" step has full implementation.
# - "embeddings" now loads configured embedding views and builds split matrices.
# - train/sweep/ensemble/evaluate are placeholders.
# - This file controls ONLY pipeline behavior, not model weights or embeddings.
################################################################################

dataset:
  ##############################################################################
  # 1) DB CONFIG
  # Path to DB connection file used by ProteinLoader (and LabelLoader in source=db)
  # Default in code: config/db.yaml
  ##############################################################################
  db_config_path: config/db.yaml

  ##############################################################################
  # 2) PROTEIN LOADER
  # Loads proteins from DB and metadata (currently organism if available)
  #
  # If empty, internal default SQL is used:
  #   - selects primary UniProt accessions
  #   - tries to include organism column when present
  #
  # Optional key:
  #   query: custom SQL that MUST return at least:
  #     - accession
  #     - organism (optional but recommended for organism-based splits)
  ##############################################################################
  protein_loader: {}
  # protein_loader:
  #   query: |
  #     SELECT a.code AS accession, p.organism AS organism
  #     FROM protein p
  #     JOIN accession a ON a.protein_id = p.id
  #     WHERE a.primary = TRUE

  ##############################################################################
  # 3) LABEL LOADER
  # Supports two sources:
  #   - source: file   (CSV labels)
  #   - source: db     (SQL query labels)
  #
  # Common behavior:
  #   - labels are aligned against DB proteins loaded by ProteinLoader
  #   - proteins missing from DB are written to artifacts/missing_proteins.txt
  #   - if same accession appears multiple times -> treated as multi-label
  ##############################################################################
  label_loader:
    # Choose one:
    # - file  -> uses file_path + column names
    # - db    -> uses db_query or db_query_file
    source: file

    # ----------------------------- FILE MODE ----------------------------------
    # Absolute or relative CSV path
    file_path: /home/alexdoro/DATASETS/mf_proteins/predictor_dataset.csv

    # CSV column name that contains accession(s)
    # This loader supports values like:
    #   "P12345"
    #   "P12345;Q99999"
    #   "P12345,Q99999"
    accession_column: "UniProt IDs"

    # CSV column name for class/label
    label_column: "Class"

    # Folder where missing proteins report is created
    artifacts_dir: artifacts

    # ------------------------------ DB MODE -----------------------------------
    # Uncomment for source: db and comment file_* options above
    # db_query: |
    #   SELECT accession, label
    #   FROM my_labels_table
    #
    # or load SQL from file
    # db_query_file: path/to/labels.sql

  ##############################################################################
  # 4) SPLIT STRATEGY
  # New independent schema:
  #   validation.strategy: random | organism | csv
  #   train_test.strategy: random | cross_validation
  #
  # IMPORTANT:
  # - Split is independent from label source.
  # - Validation selection is applied first.
  # - Train/Test split is applied on the remaining accessions.
  # - Legacy single-strategy configs are still supported.
  ##############################################################################
  split:
    # ------------------------ ACTIVE CONFIG ------------------------------------
    validation:
      # random | organism | csv
      strategy: organism

      # ---- random validation ----
      # random:
      #   val_size: 0.1
      #   random_state: 42

      # ---- organism validation ----
      organism:
        val_organisms:
          - all_others

      # ---- csv validation ----
      # csv:
      #   csv_path: /path/to/split_definition.csv
      #   accession_column: accession
      #   split_column: split
      #   validation_values: [val, validation]

    train_test:
      # random | cross_validation
      strategy: random

      # Optional: only these organisms are subject to train/test split.
      # Remaining accessions stay in train after validation is removed.
      organisms:
        - human
        - mouse
        - ecoli
        - yeast

      # ---- cross-validation train/test ----
      cross_validation:
        n_splits: 5
        fold_index: 0
        random_state: 42

      # ---- random train/test ----
      random:
        test_size: 0.2
        random_state: 42

    # ------------------- LEGACY EXAMPLE (still supported) ---------------------
    # strategy: zero_shot_organism
    # test_organisms:
    #   - human
    # train_test_organisms:
    #   - mouse
    # val_organisms:
    #   - all_others
    # test_size: 0.2

    # ---------------------- LEGACY: zero_shot_csv ------------------------------
    # strategy: zero_shot_csv
    # csv_path: /path/to/split_definition.csv
    # accession_column: accession
    # split_column: split

    # -------------------- LEGACY: cross_validation -----------------------------
    # strategy: cross_validation
    # n_splits: 5
    # fold_index: 0
    # random_state: 42

training_config_path: config/training/training_config.yaml

################################################################################
# Optional top-level sections for future steps (embeddings/train/sweep/...)
# are allowed and will be passed to their step handlers when implemented.
#
# embeddings:
#   config_path: config/embeddings.yaml
#
# Example:
# train:
#   feature_processing:
#     normalize: none  # options: none | l2 | standard
#   classifier: logistic_regression
#   max_iter: 1000
################################################################################

method: bayes
metric:
  name: f1_score
  goal: maximize

parameters:
  n_neighbors:
    min: 1
    max: 30
    distribution: int_uniform

  weights:
    values: ['uniform', 'distance']

  p_metric:
    values:
      - {p: 1, metric: 'manhattan'}
      - {p: 2, metric: 'euclidean'}
      - {p: 1, metric: 'minkowski'}
      - {p: 2, metric: 'minkowski'}

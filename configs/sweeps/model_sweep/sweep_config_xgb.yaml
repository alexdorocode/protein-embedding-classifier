method: bayes
metric:
  name: f1_score       # 🧠 this must match what you call it in wandb.log()
  goal: maximize

parameters:
  learning_rate:
    min: 0.01
    max: 0.3
    distribution: log_uniform

  n_estimators:
    values: [100, 200, 500]

  max_depth:
    values: [3, 5, 7]

  min_child_weight:
    min: 1
    max: 10
    distribution: uniform

  subsample:
    min: 0.6
    max: 1.0
    distribution: uniform

  colsample_bytree:
    min: 0.6
    max: 1.0
    distribution: uniform